name: crashlytics
description: A crashlytics wrapper to be used across all the apps
version: 1.0.0
# homepage: ''
publish_to: "none"

environment:
  sdk: ^3.10.0
resolution: workspace

dependencies:
  core:
    git:
      url: https://github.com/chaPe4ever/flutter
      ref: main
      path: pkg/core
  firebase_crashlytics: ^5.3.0
  flutter:
    sdk: flutter
  sentry_flutter: ^9.22.0

dev_dependencies:
  build_runner: ^2.6.0
  custom_builders:
    git:
      url: https://github.com/chaPe4ever/flutter
      ref: main
      path: builders/custom_builders
  # custom_lint: ^0.8.1  # Incompatible with riverpod_generator 4.x (analyzer 12 vs 8)
  firebase_core: ^4.14.0
  firebase_core_platform_interface: ^8.1.1
  firebase_crashlytics_platform_interface: ^3.9.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.5
  mockito: ^5.4.6
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
